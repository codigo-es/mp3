<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor YouTube a MP3</title>
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0f0f0f;
            --card: #212121;
            --text: #ffffff;
        }
        body {1dafc3d7e4msh38d57cd521f6fe2p10b165jsn6fda8f8f5847
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="url"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #121212;
            color: white;
            font-size: 1rem;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #2ba640;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube a MP3</h1>
    <input type="url" id="ytUrl" placeholder="Pega el enlace de YouTube aquí..." required>
    <button id="convertBtn" onclick="convertirAMP3()">Convertir a MP3</button>
    <div id="status"></div>
</div>

<script>
    async function convertirAMP3() {
        const urlInput = document.getElementById('ytUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('convertBtn');

        if (!urlInput) {
            statusDiv.innerHTML = "⚠️ Por favor, ingresa una URL válida.";
            return;
        }

        btn.disabled = true;
        statusDiv.innerHTML = "⏳ Procesando el audio, por favor espera...";

        try {
            // Se utiliza una instancia pública de la API de Cobalt para procesar la extracción
            const response = await fetch('1dafc3d7e4msh38d57cd521f6fe2p10b165jsn6fda8f8f5847', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: urlInput,
                    isAudioOnly: true,
                    aFormat: 'mp3'
                })
            });

            const data = await response.json();

            if (data.status === 'stream' || data.status === 'redirect') {
                statusDiv.innerHTML = `
                    ✅ ¡Listo!<br>
                    <a class="download-btn" href="${data.url}" target="_blank" download>Descargar MP3</a>
                `;
            } else {
                statusDiv.innerHTML = "❌ Error al procesar el vídeo. Verifica el enlace o intenta más tarde.";
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = "❌ Hubo un problema de conexión con el servidor de conversión.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>

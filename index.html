<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor YouTube a MP3</title>
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0f0f0f;
            --card: #212121;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #121212;
            color: white;
            font-size: 1rem;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 24px;
            background-color: #2ba640;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #218532;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube a MP3</h1>
    <input type="text" id="ytUrl" placeholder="Pega el enlace de YouTube aquí..." required>
    <button id="convertBtn" onclick="iniciarConversion()">Convertir a MP3</button>
    <div id="status"></div>
</div>

<script>
    // Función para extraer el ID de 11 caracteres de cualquier link de YouTube
    function extraerIdYoutube(url) {
        const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = url.match(regExp);
        if (match && match[1]) {
            return match[1];
        }
        // Si el usuario pegó directamente el ID de 11 caracteres
        if (url.length === 11) {
            return url;
        }
        return null;
    }

    async function iniciarConversion() {
        const urlInput = document.getElementById('ytUrl').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('convertBtn');

        const videoId = extraerIdYoutube(urlInput);

        if (!videoId) {
            statusDiv.innerHTML = "⚠️ Por favor, ingresa un enlace de YouTube válido.";
            return;
        }

        btn.disabled = true;
        statusDiv.innerHTML = "⏳ Procesando el audio, por favor espera...";

        await consultarAPI(videoId, statusDiv, btn);
    }

    async function consultarAPI(videoId, statusDiv, btn) {
        const url = `https://youtube-mp36.p.rapidapi.com/dl?id=${videoId}`;
        const options = {
            method: 'GET',
            headers: {
                'x-rapidapi-key': '1dafc3d7e4msh38d57cd521f6fe2p10b165jsn6fda8f8f5847',
                'x-rapidapi-host': 'youtube-mp36.p.rapidapi.com'
            }
        };

        try {
            const response = await fetch(url, options);
            const result = await response.json();

            if (result.status === 'ok' && result.link) {
                statusDiv.innerHTML = `
                    ✅ <strong>${result.title || '¡Audio listo!'}</strong><br>
                    <a class="download-btn" href="${result.link}" target="_blank" rel="noopener noreferrer">Descargar MP3</a>
                `;
                btn.disabled = false;
            } else if (result.status === 'processing') {
                // Si el vídeo es largo y la API sigue convirtiéndolo, vuelve a consultar en 2 segundos
                statusDiv.innerHTML = `⏳ Convirtiendo vídeo (${result.progress || 0}%)...`;
                setTimeout(() => consultarAPI(videoId, statusDiv, btn), 2000);
            } else {
                statusDiv.innerHTML = `❌ Error: ${result.msg || 'No se pudo convertir este vídeo.'}`;
                btn.disabled = false;
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerHTML = "❌ Hubo un problema de conexión con la API.";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
